name: cross-platform

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  core-checks:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Core imports
        run: scripts/check-core-imports.sh

      - name: SwiftPM tests
        run: swift test
